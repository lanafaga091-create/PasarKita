<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - PasarKita</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">
                <span style="font-size: 1.8rem;">🛒</span>
                <span>PasarKita</span>
            </a>
            <div class="nav-menu">
                <div id="auth-section">
                    <a href="/login" class="btn btn-sm btn-outline">Login</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Keranjang Belanja</h1>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 2rem;">
            <!-- Cart Items -->
            <div>
                <div class="card">
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>Produk</th>
                                    <th>Harga</th>
                                    <th>Jumlah</th>
                                    <th>Subtotal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items">
                                <tr>
                                    <td colspan="5" class="text-center">Memuat...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div>
                <div class="card">
                    <div class="card-body">
                        <h3>Ringkasan Pesanan</h3>
                        
                        <div style="margin-top: 1.5rem;">
                            <div class="flex-between mb-2">
                                <span>Subtotal</span>
                                <span id="subtotal">Rp 0</span>
                            </div>
                            <div class="flex-between mb-2">
                                <span>Diskon</span>
                                <span id="discount">Rp 0</span>
                            </div>
                            <hr>
                            <div class="flex-between" style="font-size: 1.2rem; font-weight: bold;">
                                <span>Total</span>
                                <span id="total">Rp 0</span>
                            </div>
                        </div>

                        <div class="form-group mt-3">
                            <label>Kode Kupon</label>
                            <input type="text" id="coupon_code" placeholder="WELCOME10" onchange="applyCoupon()">
                        </div>

                        <a href="/checkout" class="btn btn-primary" style="width: 100%; text-align: center;">
                            Lanjut ke Checkout
                        </a>

                        <a href="/" class="btn btn-outline" style="width: 100%; text-align: center; margin-top: 0.5rem;">
                            Lanjut Belanja
                        </a>
                    </div>
                </div>

                <!-- Coupon Info -->
                <div class="card mt-3">
                    <div class="card-body" style="background: var(--light); border-radius: 8px;">
                        <strong>Kupon Tersedia:</strong>
                        <ul style="margin-top: 0.5rem; margin-left: 1.5rem;">
                            <li>WELCOME10 - Hemat 10%</li>
                            <li>WELCOME25 - Hemat 25%</li>
                            <li>WELCOME50 - Hemat 50%</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!currentUser) {
                window.location.href = '/login';
                return;
            }
            loadCart();
        });
    </script>
</body>
</html>
