<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - PasarKita</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">
                <span style="font-size: 1.8rem;">🛒</span>
                <span>PasarKita</span>
            </a>
            <div class="nav-menu">
                <a href="/cart">🛒 Keranjang</a>
                <div id="auth-section">
                    <a href="/login" class="btn btn-sm btn-outline">Login</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="/" style="color: var(--primary); text-decoration: none;">← Kembali ke beranda</a>

        <div id="product-detail" class="mt-3">
            <div class="flex-center" style="padding: 3rem;">
                <div class="loading"></div>
            </div>
        </div>

        <!-- Comments Section -->
        <div class="section mt-4">
            <div class="section-title">Ulasan Produk</div>

            <!-- Add Comment Form -->
            <div class="card mb-3" id="comment-form-section">
                <div class="card-body">
                    <h4>Berikan Ulasan</h4>
                    <div class="form-group">
                        <label for="comment_rating">Rating</label>
                        <select id="comment_rating">
                            <option value="5">⭐⭐⭐⭐⭐ Sangat Bagus</option>
                            <option value="4">⭐⭐⭐⭐ Bagus</option>
                            <option value="3">⭐⭐⭐ Biasa</option>
                            <option value="2">⭐⭐ Kurang</option>
                            <option value="1">⭐ Buruk</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="comment_text">Komentar</label>
                        <textarea id="comment_text" placeholder="Bagikan pengalaman Anda dengan produk ini..."></textarea>
                    </div>
                    <button onclick="addComment({{ product_id }})" class="btn btn-primary">
                        Kirim Ulasan
                    </button>
                </div>
            </div>

            <!-- Comments List -->
            <div id="comments-container">
                <p class="text-center">Tidak ada ulasan untuk produk ini</p>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const productId = {{ product_id }};
            if (productId) {
                initProductPage(productId);
            }
        });
    </script>
</body>
</html>
